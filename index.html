<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge Experiment Demos</title>
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            padding: 20px;
            text-align: center;
        }
        header h1 { font-size: 1.4em; font-weight: 500; color: #a0c4ff; }
        header p { font-size: 0.85em; color: #888; margin-top: 4px; }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 0 20px 16px;
        }
        select, button {
            font-size: 0.9em;
            padding: 8px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #16213e;
            color: #e0e0e0;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        button:not(:disabled):hover {
            background: #0f3460;
        }
        #stop-btn { background: #5c1a1a; border-color: #8b3a3a; display: none; }
        #stop-btn:hover { background: #7a2a2a; }
        #export-btn { background: #1a3c1a; border-color: #3a6b3a; }
        #export-btn:hover:not(:disabled) { background: #2a5c2a; }
        .checkbox-label {
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            user-select: none;
        }

        #session-status {
            font-size: 0.85em;
            color: #888;
            padding: 0 20px 8px;
            min-height: 1.2em;
        }

        #canvas-container {
            width: 600px;
            height: 600px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0a0a1a;
            position: relative;
            outline: none;
        }
        #canvas-container:focus {
            border-color: #4488ff;
        }
	#canvas-container.dual-canvas-mode {
	    width: 1220px;
	    height: 600px;
	}
        .instructions-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 26, 0.95);
            display: flex;
            /* flex-start + `margin: auto 0` on the content, rather than
               align-items: center: a centered flex item taller than its container
               is clipped at BOTH ends and cannot be scrolled back to. Copy longer
               than the canvas now scrolls instead. cp_prp's instructions already
               overflowed 600 px before the training screens were added. */
            align-items: flex-start;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
            z-index: 10;
            border-radius: 8px;
        }
        .instructions-content {
            /* The copy is authored with hard line breaks at ~66 characters (see
               canonical_paradigms.js). At 80% of a 600 px canvas the measure only
               fits ~55, so almost every authored line ALSO soft-wrapped, producing
               a ragged two-line-per-sentence screen. The overlay's 20 px padding
               already supplies the margin, so the content may use the full width
               and the authored breaks land where they were written. */
            max-width: 100%;
            margin: auto 0;
            text-align: center;
            font-size: 1em;
            line-height: 1.6;
            color: #c0c0c0;
        }

        .info {
            margin-top: 16px;
            padding: 0 20px;
            font-size: 0.8em;
            color: #555;
            max-width: 600px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bridge Experiment Demos</h1>
        <p>Parametric bridges between task switching and dual-task paradigms</p>
    </header>

    <div class="controls">
        <select id="demo-select">
            <option value="">-- Select a demo --</option>
            <optgroup label="Generic Demos">
                <option value="demo_session">Single-Canvas (Pure + Mixed + PRP)</option>
                <option value="demo_prp_only">Single-Canvas PRP only</option>
                <option value="demo_mixed_only">Single-Canvas Mixed only</option>
                <option value="demo_dual_same">Dual-Canvas Same Task</option>
            </optgroup>
            <optgroup label="Canonical Paradigms">
                <option value="cp_prp">PRP / Dual-Task (SOA)</option>
                <option value="cp_taskswitch">Task Switching (basic)</option>
                <option value="cp_taskswitch_asym">Task Switching (asymmetric)</option>
                <option value="cp_stroop">Stroop / Interference (basic)</option>
                <option value="cp_stroop_crossed">Stroop (crossed target × distractor)</option>
            </optgroup>
            <optgroup label="Canonical Paradigms — full session (training + test)">
                <option value="cp_prp_training">PRP / Dual-Task — training + test</option>
                <option value="cp_taskswitch_training">Task Switching (basic) — training + test</option>
                <option value="cp_taskswitch_asym_training">Task Switching (asymmetric) — training + test</option>
                <option value="cp_stroop_training">Stroop / Interference — training + test</option>
                <option value="cp_stroop_crossed_training">Stroop (crossed) — training + test</option>
            </optgroup>
            <optgroup label="Switch Frequency">
                <option value="sf_univalent">Univalent (pure switch costs)</option>
                <option value="sf_neutral">Neutral (orthogonal dimensions)</option>
                <option value="sf_bivalent">Bivalent (congruency + Gratton)</option>
            </optgroup>
            <optgroup label="Hirsch Replication">
                <option value="hirsch_faithful">Full Replication</option>
                <option value="hirsch_faithful_orthogonal">Full Replication (Orthogonal Mapping)</option>
                <option value="hirsch_part1">Part 1: Task Switching</option>
                <option value="hirsch_part2">Part 2: Dual-Canvas PRP</option>
            </optgroup>
            <optgroup label="Bug Testing">
                <option value="timing_bug_soa">T2 Timing Bug (SOA sweep)</option>
            </optgroup>
            <optgroup label="Hirsch Quick Tests">
                <option value="hirsch_alt_pure">Alternating Pure</option>
                <option value="hirsch_alt_mixed">Alternating Mixed</option>
                <option value="hirsch_prp_baseline">PRP Baseline (Asterisk)</option>
                <option value="hirsch_prp">PRP Dual-Canvas</option>
		<option value="hirsch_quest_demo">Quest Demo</option>
            </optgroup>
        </select>
        <button id="start-btn" disabled>Start</button>
        <button id="stop-btn">Stop</button>
        <button id="export-btn" disabled>Export CSV</button>
        <label class="checkbox-label">
            <input type="checkbox" id="abridged-cb" checked>
            Abridged (1/10 trials)
        </label>
    </div>

    <div id="session-status"></div>

    <div id="canvas-container" tabindex="-1">
        <div class="instructions-overlay">
            <div class="instructions-content">Select a demo and press Start</div>
        </div>
    </div>

    <div class="info">
        Click the canvas area to give it focus before starting.
        Keys: A = left, D = right.
    </div>

    <!-- Dependencies -->
    <script src="node_modules/super-experiment/dist/bundle.js"></script>
    <script src="engine.js"></script>
    <!-- Before the config files on purpose: buildSharedTrainingStages must be
         callable from a config file's top-level code. -->
    <script src="training_stages.js"></script>
    <script src="demo_block_configs.js"></script>
    <script src="hirsch_block_configs.js"></script>
    <script src="switch-frequency.js"></script>
    <script src="canonical_paradigms.js"></script>
    <script src="timing_bug_test.js"></script>
    <script src="session_helpers.js"></script>
    <script src="session.js"></script>

    <script>
        const selectEl = document.getElementById('demo-select');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const exportBtn = document.getElementById('export-btn');
        const abridgedCb = document.getElementById('abridged-cb');
        const container = document.getElementById('canvas-container');

        selectEl.addEventListener('change', () => {
            startBtn.disabled = !selectEl.value;
        });

        function getSessionDef(id) {
            let blocks;
            switch (id) {
                // Generic demos
                case 'demo_session':
                    blocks = DEMO_SESSION;
                    break;
                case 'demo_prp_only':
                    blocks = [DEMO_SESSION[3]];
                    break;
                case 'demo_mixed_only':
                    blocks = [DEMO_SESSION[2]];
                    break;
                case 'demo_dual_same':
                    blocks = DEMO_DUAL_CANVAS_SAME_SESSION;
                    break;
                // Canonical paradigms
                case 'cp_prp':
                    blocks = CP_PRP_SESSION;
                    break;
                case 'cp_taskswitch':
                    blocks = CP_TASKSWITCH_SESSION;
                    break;
                case 'cp_taskswitch_asym':
                    blocks = CP_TASKSWITCH_ASYM_SESSION;
                    break;
                case 'cp_stroop':
                    blocks = CP_STROOP_SESSION;
                    break;
                case 'cp_stroop_crossed':
                    blocks = CP_STROOP_CROSSED_SESSION;
                    break;
                // Canonical paradigms, full participant-facing session:
                // S1-S6 + S8 training followed by the same
                // test blocks the five entries above run on their own.
                case 'cp_prp_training':
                    blocks = CP_PRP_TRAINING_SESSION;
                    break;
                case 'cp_taskswitch_training':
                    blocks = CP_TASKSWITCH_TRAINING_SESSION;
                    break;
                case 'cp_taskswitch_asym_training':
                    blocks = CP_TASKSWITCH_ASYM_TRAINING_SESSION;
                    break;
                case 'cp_stroop_training':
                    blocks = CP_STROOP_TRAINING_SESSION;
                    break;
                case 'cp_stroop_crossed_training':
                    blocks = CP_STROOP_CROSSED_TRAINING_SESSION;
                    break;
                // Switch frequency
                case 'sf_univalent':
                    blocks = SF_UNIVALENT_SESSION;
                    break;
                case 'sf_neutral':
                    blocks = SF_NEUTRAL_SESSION;
                    break;
                case 'sf_bivalent':
                    blocks = SF_BIVALENT_SESSION;
                    break;
                // Hirsch replication
                // Bug testing
                case 'timing_bug_soa':
                    blocks = TIMING_BUG_SESSION;
                    break;
                case 'hirsch_faithful':
                    blocks = HIRSCH_FAITHFUL_SESSION;
                    break;
                case 'hirsch_faithful_orthogonal':
                    blocks = HIRSCH_FAITHFUL_ORTHOGONAL_SESSION;
                    break;
                case 'hirsch_part1':
                    blocks = HIRSCH_TASK_SWITCHING_SESSION;
                    break;
                case 'hirsch_part2':
                    blocks = HIRSCH_DUAL_CANVAS_SESSION;
                    break;
                // Hirsch quick tests
                case 'hirsch_alt_pure':
                    blocks = HIRSCH_ALT_PURE_DEMO;
                    break;
                case 'hirsch_alt_mixed':
                    blocks = HIRSCH_ALT_MIXED_DEMO;
                    break;
                case 'hirsch_prp_baseline':
                    blocks = HIRSCH_PRP_BASELINE_DEMO;
                    break;
                case 'hirsch_prp':
                    blocks = HIRSCH_PRP_DEMO;
                    break;
                case 'hirsch_quest_demo':
                    blocks = HIRSCH_QUEST_DEMO;
                    break;
                default:
                    return null;
            }

            // SweetPea counterbalanced sequences: opt in per participant via
            // ?participant=NN&condition=A|B. Without these params the canonical
            // paradigms use the interim JS generator (default/fallback).
            // The training sessions are included: cpApplySweetPea skips their
            // training stages (which are generated live and have no CSV) and
            // still swaps the test block onto its counterbalanced sequence.
            const cpIds = [
                'cp_prp', 'cp_taskswitch', 'cp_taskswitch_asym', 'cp_stroop', 'cp_stroop_crossed',
                'cp_prp_training', 'cp_taskswitch_training', 'cp_taskswitch_asym_training',
                'cp_stroop_training', 'cp_stroop_crossed_training',
            ];
            const urlParams = new URLSearchParams(window.location.search);
            const participant = urlParams.get('participant');
            const condition = (urlParams.get('condition') || 'A').toUpperCase();
            if (participant && cpIds.includes(id)) {
                blocks = cpApplySweetPea(blocks, participant, condition);
            }

            const isDualCanvas = blocks.some(b =>
                ['dual-canvas', 'alternating', 'prp-baseline'].includes(b.blockConfig.paradigm));
            const isOrthogonal = blocks.some(b => b.blockConfig.mapping === 'orthogonal');
            // Single-canvas blocks may still be two-handed: every paradigm with two
            // tasks now uses task-tied disjoint keys (07-31 l.49), so the hint has to
            // follow the block's own rso rather than assume one hand.
            const isDisjointKeys = blocks.some(b => b.blockConfig.rso === 'disjoint');
            const infoDiv = document.querySelector('.info');
            if (isOrthogonal) {
                infoDiv.innerHTML = 'Click the canvas area to give it focus before starting.<br>Left canvas: A = up, D = down<br>Right canvas: J = up, L = down';
            } else if (isDualCanvas) {
                infoDiv.innerHTML = 'Click the canvas area to give it focus before starting.<br>Left task controls: A = left, D = right<br>Right task controls: J = left, L = right';
            } else if (isDisjointKeys) {
                infoDiv.innerHTML = 'Click the canvas area to give it focus before starting.<br>Movement: A = left, D = right (left hand)<br>Orientation: J = left, L = right (right hand)';
            } else {
                infoDiv.innerHTML = 'Click the canvas area to give it focus before starting.<br>Keys: A = left, D = right.';
            }

            // Inject t1Side from URL param into all block configs
            const t1Side = new URLSearchParams(window.location.search).get('t1Side') || 'left';
            if (t1Side === 'right') {
                blocks = blocks.map(b => {
                    let text = b.instructions;
                    if (text) {
                        // Swap spatial and motor references for right-first layout.
                        // Each side word is swapped together with its key labels so
                        // hand-follows-side associations stay correct (left canvas = a/d,
                        // right canvas = j/l) — only which side is mentioned first changes.
                        text = text.replace(/LEFT/g, '_TMP_R_').replace(/RIGHT/g, 'LEFT').replace(/_TMP_R_/g, 'RIGHT')
                                   .replace(/Left/g, '_TMP_R2_').replace(/Right/g, 'Left').replace(/_TMP_R2_/g, 'Right')
                                   .replace(/left/g, '_TMP_R3_').replace(/right/g, 'left').replace(/_TMP_R3_/g, 'right')
                                   // Parallel design: horizontal key pairs.
                                   .replace(/A\/D/g, '_TMP_K_').replace(/J\/L/g, 'A/D').replace(/_TMP_K_/g, 'J/L')
                                   // Orthogonal design: up/down key labels (a/d <-> j/l).
                                   .replace(/A = up/g, '_TMP_KU_').replace(/J = up/g, 'A = up').replace(/_TMP_KU_/g, 'J = up')
                                   .replace(/D = down/g, '_TMP_KD_').replace(/L = down/g, 'D = down').replace(/_TMP_KD_/g, 'L = down')
                                   .replace(/A \(/g, '_TMP_KP1_').replace(/J \(/g, 'A (').replace(/_TMP_KP1_/g, 'J (')
                                   .replace(/D \(/g, '_TMP_KP2_').replace(/L \(/g, 'D (').replace(/_TMP_KP2_/g, 'L (');
                    }
                    return { ...b, instructions: text, blockConfig: { ...b.blockConfig, t1Side } };
                });
            } else {
                blocks = blocks.map(b => ({ ...b, blockConfig: { ...b.blockConfig, t1Side } }));
            }

            if (abridgedCb.checked) {
                // Criterion training stages carry no numTrials — runBlock caps
                // them at TRAINING_CAP and stops on the advancement criterion —
                // so leave those alone. Scaling undefined produced NaN, which
                // then showed up in the trial counter.
                blocks = blocks.map(b => (Number.isFinite(b.numTrials)
                    ? { ...b, numTrials: Math.max(1, Math.round(b.numTrials / 10)) }
                    : b));
            }

            return blocks;
        }

        startBtn.addEventListener('click', async () => {
            const sessionDef = getSessionDef(selectEl.value);
            if (!sessionDef) return;

            startBtn.style.display = 'none';
            selectEl.disabled = true;
            stopBtn.style.display = '';
            exportBtn.disabled = true;
            container.focus();

            try {
                // Stimulus type: concrete fish sprites by default; ?stimulus=abstract for circles/triangles.
                const stimulus = new URLSearchParams(window.location.search).get('stimulus') || 'fish';
                await Session.runSession(sessionDef, container, { stimulus, abridged: abridgedCb.checked });
            } catch (e) {
                console.error('Session error:', e);
                document.getElementById('session-status').textContent = `Error: ${e.message}`;
            }

            stopBtn.style.display = 'none';
            startBtn.style.display = '';
            selectEl.disabled = false;
        });

        stopBtn.addEventListener('click', () => {
            Session.stopSession();
        });

        exportBtn.addEventListener('click', () => {
            Session.exportCSV();
        });
    </script>
</body>
</html>
